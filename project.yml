# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate && open FreeTrack.xcodeproj`
name: FreeTrack
options:
  bundleIdPrefix: com.ashtonkirkman
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Team ID once you have an Apple Developer account (or a free Personal Team in Xcode).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  FreeTrack:
    type: application
    platform: iOS
    sources:
      - path: FreeTrack
        excludes:
          - "Resources/Info.plist"
          - "Resources/FreeTrack.entitlements"
          - "**/*.md"
    # Generated by XcodeGen (git-ignored). Sign in with Apple needs the capability enabled on the
    # App ID in the developer portal; simulator builds with signing disabled ignore it.
    entitlements:
      path: FreeTrack/Resources/FreeTrack.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: FreeTrack/Resources/Info.plist
      properties:
        CFBundleDisplayName: Free Track
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Custom scheme the account API redirects to after Google / Facebook sign-in
        # (freetrack://auth/callback), consumed by ASWebAuthenticationSession.
        CFBundleURLTypes:
          - CFBundleURLName: com.ashtonkirkman.morsel
            CFBundleURLSchemes: [freetrack]
        NSCameraUsageDescription: Free Track uses the camera to scan barcodes, photograph meals and take body-scan photos for on-device measurements.
        NSPhotoLibraryUsageDescription: Free Track can estimate calories from meal photos you pick from your library, and keeps progress photos you choose for body comparisons.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashtonkirkman.morsel
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FreeTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FreeTrackTests]
    dependencies:
      - target: FreeTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashtonkirkman.morsel.tests
        GENERATE_INFOPLIST_FILE: YES
  FreeTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FreeTrackUITests]
    dependencies:
      - target: FreeTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashtonkirkman.morsel.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FreeTrack
schemes:
  # Screenshot walk-through (UI tests only). `make screenshots` / CI "Screenshots" step.
  FreeTrackScreenshots:
    build:
      targets:
        FreeTrack: all
        FreeTrackUITests: [test]
    test:
      config: Debug
      targets: [FreeTrackUITests]
  FreeTrack:
    build:
      targets:
        FreeTrack: all
        FreeTrackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [FreeTrackTests]
    archive:
      config: Release
