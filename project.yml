# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate && open Morsel.xcodeproj`
name: Morsel
options:
  bundleIdPrefix: com.ashtonkirkman
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Team ID once you have an Apple Developer account (or a free Personal Team in Xcode).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Morsel:
    type: application
    platform: iOS
    sources:
      - path: Morsel
        excludes:
          - "Resources/Info.plist"
          - "**/*.md"
    info:
      path: Morsel/Resources/Info.plist
      properties:
        CFBundleDisplayName: Morsel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Morsel uses the camera to scan barcodes and photograph meals so it can log calories for you.
        NSPhotoLibraryUsageDescription: Morsel can estimate calories from meal photos you pick from your library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashtonkirkman.morsel
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MorselTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MorselTests]
    dependencies:
      - target: Morsel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashtonkirkman.morsel.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Morsel:
    build:
      targets:
        Morsel: all
        MorselTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [MorselTests]
    archive:
      config: Release
