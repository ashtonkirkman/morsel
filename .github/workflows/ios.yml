name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # the build job force-pushes the `screenshots` branch

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    env:
      RESULT_BUNDLE: TestResults.xcresult
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 16
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew update >/dev/null || true
          brew install xcodegen
          xcodegen version

      - name: Install xcpretty (optional)
        continue-on-error: true
        run: sudo gem install xcpretty --no-document

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Pick newest iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true   # pre-warm; harmless if already booted

      - name: Build & test
        run: |
          set -euo pipefail
          DEST="platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          ARGS=(-project Morsel.xcodeproj -scheme Morsel -destination "$DEST"
                -skipPackagePluginValidation -resultBundlePath "$RESULT_BUNDLE"
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild "${ARGS[@]}" build test | xcpretty --color --simple
          else
            echo "::notice::xcpretty unavailable, printing raw xcodebuild output"
            xcodebuild "${ARGS[@]}" build test
          fi

      - name: Screenshots (Simulator walk-through)
        id: shots
        run: |
          set -euo pipefail
          DEST="platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          export TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots"
          mkdir -p screenshots
          xcodebuild -project Morsel.xcodeproj -scheme MorselScreenshots -destination "$DEST" \
            -skipPackagePluginValidation -resultBundlePath ScreenshotResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
          ls -la screenshots
          python3 -m pip install --quiet --user pillow \
            || python3 -m pip install --quiet --break-system-packages pillow \
            || echo "::warning::pillow install failed; no contact sheet"
          python3 scripts/contact_sheet.py screenshots screenshots/contact-sheet.png \
            || echo "::warning::contact sheet generation failed"

      - name: Upload screenshots
        if: always() && steps.shots.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Build unsigned device IPA (for Sideloadly / AltStore)
        id: ipa
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          xcodebuild -project Morsel.xcodeproj -scheme Morsel -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcpretty && test "${PIPESTATUS[0]}" -eq 0
          rm -rf Payload && mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/Morsel.app Payload/
          zip -qry Morsel-unsigned.ipa Payload
          ls -la Morsel-unsigned.ipa

      - name: Upload IPA artifact
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Morsel-unsigned-ipa-${{ github.run_number }}
          path: Morsel-unsigned.ipa
          retention-days: 90

      - name: Update rolling "latest" release with the IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ipa.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Unsigned device build from ${GITHUB_SHA::7} ($(date -u +%F)). Sign and install with Sideloadly or AltStore; see docs/INSTALL_ON_IPHONE.md."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease --title "Morsel (latest main)" --notes "$NOTES"
          else
            gh release create latest --prerelease --title "Morsel (latest main)" --notes "$NOTES"
          fi
          gh release upload latest Morsel-unsigned.ipa --clobber

      - name: Publish screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shots.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/shots && mkdir -p /tmp/shots && cp screenshots/*.png /tmp/shots/
          git checkout --orphan screenshots
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/shots/*.png .
          {
            printf '# Morsel screenshots\n\nGenerated by CI from %s on %s.\n\n' "${GITHUB_SHA::7}" "$(date -u +%FT%TZ)"
            [ -f contact-sheet.png ] && printf '![All screens](contact-sheet.png)\n\n'
            for f in [0-9]*.png; do printf '## %s\n\n![%s](%s)\n\n' "${f%.png}" "${f%.png}" "$f"; done
          } > README.md
          git add -A
          git commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -f origin screenshots

      - name: Upload .xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_number }}
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  fastlane-syntax:
    name: Fastfile syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ruby -c fastlane/Fastfile && ruby -c fastlane/Appfile
      - run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflows parse')"

  swiftlint:
    name: SwiftLint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/work -w /work ghcr.io/realm/swiftlint:latest \
            swiftlint lint --reporter github-actions-logging

  proxy:
    name: Proxy typecheck (server/claude-proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # hashFiles() only works after checkout, so the guard lives on the steps rather than the job.
      - name: Setup Node 20
        if: hashFiles('server/claude-proxy/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/claude-proxy/package-lock.json
      - name: npm ci + tsc --noEmit
        if: hashFiles('server/claude-proxy/package.json') != ''
        working-directory: server/claude-proxy
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx tsc --noEmit
      - name: Skipped
        if: hashFiles('server/claude-proxy/package.json') == ''
        run: echo "server/claude-proxy/package.json not present yet; nothing to typecheck."
