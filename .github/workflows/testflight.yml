name: TestFlight

# Builds a signed Release archive on a GitHub macOS runner and uploads it to TestFlight.
# Run it by hand from the Actions tab (workflow_dispatch) or push a tag like v0.1.0.
# Needs the repository secrets listed in docs/INSTALL_ON_IPHONE.md (Route B).

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What to test (shown in TestFlight)"
        required: false
        default: "Internal build"
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    name: Sign & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave GITHUB_TOKEN wired into git config for github.com: it would override the
          # MATCH_GIT_PAT credential when match clones the private certificates repo.
          persist-credentials: false

      - name: Select newest Xcode 16
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install XcodeGen, xcpretty, fastlane
        run: |
          set -euo pipefail
          brew update >/dev/null || true
          brew install xcodegen
          sudo gem install xcpretty --no-document
          if ! command -v fastlane >/dev/null; then brew install fastlane; fi
          fastlane --version | tail -n 1

      - name: Check secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT MATCH_PASSWORD MATCH_GIT_PAT; do
            if [ -z "${!v:-}" ]; then echo "::error::repository secret $v is not set"; missing=1; fi
          done
          exit $missing

      - name: Check the certificates repo is reachable with MATCH_GIT_PAT
        env:
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || 'https://github.com/ashtonkirkman/morsel-certificates.git' }}
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
          MATCH_GIT_USER: ${{ vars.MATCH_GIT_USER || github.repository_owner }}
        run: |
          set -uo pipefail
          RAW_LEN=${#MATCH_GIT_PAT}
          PAT=$(printf '%s' "$MATCH_GIT_PAT" | tr -d '[:space:]')
          echo "token: length=${#PAT} (raw ${RAW_LEN}, stray whitespace: $([ "$RAW_LEN" = "${#PAT}" ] && echo no || echo YES)), prefix=${PAT:0:11}"
          REPO_PATH=$(printf '%s' "$MATCH_GIT_URL" | sed -E 's#^https://github.com/##; s#\.git/?$##')
          USER_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PAT" https://api.github.com/user)
          REPO_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PAT" "https://api.github.com/repos/$REPO_PATH")
          echo "GET /user -> $USER_CODE   (200 = token valid, 401 = token string wrong/revoked/expired)"
          echo "GET /repos/$REPO_PATH -> $REPO_CODE   (200 = repo visible to token, 404 = repo not in the token's selection)"
          AUTH=$(printf '%s:%s' "$MATCH_GIT_USER" "$PAT" | base64 | tr -d '\n')
          cd "$RUNNER_TEMP"   # outside the checkout, so no repo-local git config can interfere
          if git -c "http.extraheader=Authorization: Basic $AUTH" ls-remote "$MATCH_GIT_URL" >/dev/null 2>err.txt; then
            echo "OK: $MATCH_GIT_URL is readable with MATCH_GIT_PAT"
            exit 0
          fi
          cat err.txt
          if [ "$USER_CODE" != "200" ]; then
            echo "::error::MATCH_GIT_PAT is not a valid token (GitHub answers $USER_CODE). The secret holds an old/regenerated/mistyped value. Generate a token at github.com/settings/personal-access-tokens (Only select repositories -> morsel-certificates, Contents: Read and write), copy the whole github_pat_... string, and paste it into the MATCH_GIT_PAT secret."
          elif [ "$REPO_CODE" != "200" ]; then
            echo "::error::The token is valid but cannot see $REPO_PATH (GitHub answers $REPO_CODE). Edit the token: Repository access = Only select repositories -> tick morsel-certificates; Permissions -> Contents = Read and write; click Update."
          else
            echo "::error::Token valid and repo visible, but git clone was refused: Contents permission is probably Read-only. Set Contents = Read and write on the token."
          fi
          exit 1

      - name: fastlane beta
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || 'https://github.com/ashtonkirkman/morsel-certificates.git' }}
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
          MATCH_GIT_USER: ${{ vars.MATCH_GIT_USER || github.repository_owner }}
          BUILD_NUMBER: ${{ github.run_number }}
          TESTFLIGHT_CHANGELOG: ${{ inputs.changelog || github.ref_name }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          export MATCH_GIT_BASIC_AUTHORIZATION
          PAT=$(printf '%s' "$MATCH_GIT_PAT" | tr -d '[:space:]')
          MATCH_GIT_BASIC_AUTHORIZATION=$(printf '%s:%s' "$MATCH_GIT_USER" "$PAT" | base64 | tr -d '\n')
          fastlane ios beta

      - name: Upload signed IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Morsel-TestFlight-${{ github.run_number }}
          path: fastlane/build/Morsel.ipa
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload fastlane logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs-${{ github.run_number }}
          path: |
            ~/Library/Logs/gym/*.log
            fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 14
